<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-siantri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0c1626"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-siantri" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-siantri)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Browser Chrome Bar -->
  <rect x="20" y="16" width="760" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="42" cy="35" r="5" fill="#ef4444"/>
  <circle cx="58" cy="35" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="35" r="5" fill="#10b981"/>
  <rect x="96" y="24" width="280" height="22" rx="5" fill="#1e293b"/>
  <text x="110" y="39" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">siantri.resto.local • SSE Real-Time Active</text>
  <rect x="670" y="24" width="95" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="682" cy="35" r="3.5" fill="#10b981" filter="url(#glow-siantri)"/>
  <text x="692" y="39" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">24/7 ONLINE</text>

  <!-- Main App Header Inside Canvas -->
  <rect x="20" y="62" width="760" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="94" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">🍜 SiAntri Resto &amp; UMKM</text>
  <text x="240" y="93" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">Multi-Device Live Queue &amp; Order Engine</text>

  <rect x="600" y="74" width="165" height="28" rx="6" fill="#10b981"/>
  <text x="682" y="93" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Buat Tiket Antrean</text>

  <!-- Left Card: Customer Ticket Display -->
  <g transform="translate(20, 124)">
    <rect width="240" height="295" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#131d33"/>
    <text x="16" y="27" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">📱 LAYAR PEMESAN (MEJA)</text>
    
    <!-- Big Queue Number Box -->
    <rect x="18" y="55" width="204" height="85" rx="10" fill="#090e1a" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="120" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">NOMOR ANTRIAN ANDA</text>
    <text x="120" y="125" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800" text-anchor="middle" filter="url(#glow-siantri)">#A-042</text>

    <!-- Order Item Row -->
    <rect x="18" y="152" width="204" height="42" rx="6" fill="#1e293b"/>
    <text x="28" y="171" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Nasi Goreng Seafood (x2)</text>
    <text x="28" y="186" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Meja 04 • Level Pedas 2</text>
    <text x="212" y="178" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="end">Rp 48.000</text>

    <rect x="18" y="202" width="204" height="42" rx="6" fill="#1e293b"/>
    <text x="28" y="221" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Es Jeruk Murni (x2)</text>
    <text x="28" y="236" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Less Sugar • Cold</text>
    <text x="212" y="228" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="end">Rp 16.000</text>

    <rect x="18" y="254" width="204" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="272" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: Sedang Disiapkan</text>
  </g>

  <!-- Center Card: Kitchen / Dapur Chef Anton -->
  <g transform="translate(272, 124)">
    <rect width="256" height="295" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="256" height="42" rx="12" fill="#131d33"/>
    <text x="16" y="27" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">👨‍🍳 LAYAR DAPUR (CHEF DISPLAY)</text>
    
    <!-- Order Card 1 In Kitchen -->
    <rect x="16" y="55" width="224" height="105" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="26" y="75" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">#A-041 • DINE-IN</text>
    <rect x="165" y="62" width="65" height="18" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="197" y="75" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DIMASAK</text>
    <text x="26" y="97" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">1x Ayam Bakar Madu</text>
    <text x="26" y="113" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">1x Cah Kangkung Terasi</text>
    <rect x="26" y="125" width="204" height="24" rx="4" fill="#059669"/>
    <text x="128" y="141" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ Tandai Siap Saji</text>

    <!-- Order Card 2 In Kitchen -->
    <rect x="16" y="170" width="224" height="110" rx="8" fill="#141d2e" stroke="#334155"/>
    <text x="26" y="190" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">#A-042 • TAKEAWAY</text>
    <rect x="165" y="177" width="65" height="18" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="197" y="190" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MENUNGGU</text>
    <text x="26" y="212" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">2x Nasi Goreng Seafood</text>
    <text x="26" y="228" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">2x Es Jeruk Murni</text>
    <rect x="26" y="242" width="204" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="128" y="258" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Mulai Memasak</text>
  </g>

  <!-- Right Card: Cashier & Big TV Monitor -->
  <g transform="translate(540, 124)">
    <rect width="240" height="295" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#131d33"/>
    <text x="16" y="27" fill="#a855f7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">🖥️ MONITOR PANGGILAN KASIR</text>
    
    <!-- Big Calling Screen -->
    <rect x="16" y="55" width="208" height="130" rx="10" fill="#030712" stroke="#a855f7" stroke-width="1.5"/>
    <text x="120" y="78" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SEDANG DIPANGGIL</text>
    <text x="120" y="125" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-siantri)">#A-040</text>
    <text x="120" y="155" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">SILAKAN KE LOKET 1</text>
    <rect x="16" y="166" width="208" height="19" rx="0 0 10 10" fill="#f43f5e"/>
    <text x="120" y="179" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">AUDIO DING-DONG AKTIF</text>

    <!-- Quick Call Button Controls -->
    <rect x="16" y="196" width="208" height="34" rx="8" fill="#a855f7"/>
    <text x="120" y="218" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🔊 Panggil Nomor Berikutnya</text>

    <!-- Live Telemetry Stats -->
    <g transform="translate(16, 240)">
      <rect width="98" height="42" rx="6" fill="#1e293b"/>
      <text x="49" y="255" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TOTAL TIKET</text>
      <text x="49" y="273" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">84 Pesanan</text>

      <rect x="110" width="98" height="42" rx="6" fill="#1e293b"/>
      <text x="159" y="255" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WAKTU TUNGGU</text>
      <text x="159" y="273" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">~6.4 Menit</text>
    </g>
  </g>
</svg>
