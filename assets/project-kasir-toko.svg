  <!-- Right Side: Cart Summary & QR DANA Checkout -->
  <g transform="translate(505, 122)">
    <rect width="275" height="298" rx="12" fill="#111827" stroke="#1f2937"/>
    <rect x="0" y="0" width="275" height="38" rx="12 12 0 0" fill="#1a2333"/>
    <text x="16" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">🛒 RINGKASAN ORDER (INV-0482)</text>
    
    <!-- Item 1 -->
