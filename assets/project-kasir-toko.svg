      <rect width="138" height="105" rx="8" fill="#1a2333" stroke="#374151"/>
      <rect x="10" y="10" width="118" height="42" rx="6" fill="#0f172a"/>
      <text x="69" y="35" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">🧃 MILK TEA</text>
      <text x="12" y="72" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Matcha Latte 1L</text>
      <text x="12" y="88" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Rp 32.000</text>
