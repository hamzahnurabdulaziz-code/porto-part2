      <text x="12" y="88" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Rp 26.500</text>
      <rect x="96" y="73" width="32" height="22" rx="4" fill="#374151"/>
      <text x="112" y="88" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">+</text>
