      <rect x="10" y="10" width="118" height="42" rx="6" fill="#0f172a"/>
      <text x="69" y="35" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">💧 AIR MINERAL</text>
