    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Chrome Window Top -->
  <rect x="20" y="16" width="760" height="38" rx="8" fill="#111827" stroke="#1f2937"/>
  <circle cx="42" cy="35" r="5" fill="#ef4444"/>
  <circle cx="58" cy="35" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="35" r="5" fill="#10b981"/>
  <rect x="96" y="24" width="310" height="22" rx="5" fill="#1f2937"/>
  <text x="110" y="39" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">kasirtoko.local/pos • Laravel 13 + Livewire + DANA</text>
  <rect x="655" y="24" width="110" height="22" rx="11" fill="rgba(0, 163, 224, 0.15)" stroke="#00a3e0" stroke-width="1"/>
  <circle cx="667" cy="35" r="3.5" fill="#00a3e0" filter="url(#glow-kasir)"/>
  <text x="677" y="39" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">QR DANA READY</text>

  <!-- App Header Bar -->
