  <text x="40" y="93" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">🏪 Kasir Toko Modern POS</text>
  <text x="260" y="92" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="12">Direct POS • Tanpa Login • Quick Checkout</text>

  <rect x="625" y="73" width="140" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="695" y="91" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Kasir: Standar 01</text>

