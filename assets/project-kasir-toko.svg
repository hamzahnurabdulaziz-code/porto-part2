    <text x="130" y="172" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Scan QR dengan aplikasi</text>
    <text x="130" y="184" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">DANA / QRIS Bank Mandiri</text>
    <rect x="130" y="196" width="118" height="24" rx="4" fill="#00a3e0"/>
    <text x="189" y="212" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cek Pembayaran Auto</text>

    <!-- Bottom Actions -->
