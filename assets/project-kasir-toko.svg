    <text x="259" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="end">Rp 32.000</text>

    <line x1="16" y1="92" x2="259" y2="92" stroke="#374151" stroke-width="1" stroke-dasharray="3 3"/>
    
    <text x="16" y="110" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Tagihan:</text>
    <text x="259" y="112" fill="#00a3e0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="end">Rp 122.000</text>

    <!-- QR DANA Box -->
