    <!-- QR Code Mockup Graphic -->
    <g transform="translate(28, 137)">
      <rect width="90" height="90" rx="4" fill="#ffffff"/>
      <!-- QR Blocks -->
      <rect x="8" y="8" width="26" height="26" fill="#000000"/>
      <rect x="12" y="12" width="18" height="18" fill="#ffffff"/>
      <rect x="15" y="15" width="12" height="12" fill="#000000"/>

      <rect x="56" y="8" width="26" height="26" fill="#000000"/>
      <rect x="60" y="12" width="18" height="18" fill="#ffffff"/>
      <rect x="63" y="15" width="12" height="12" fill="#000000"/>

      <rect x="8" y="56" width="26" height="26" fill="#000000"/>
      <rect x="12" y="60" width="18" height="18" fill="#ffffff"/>
      <rect x="15" y="63" width="12" height="12" fill="#000000"/>

      <!-- Random Data dots -->
      <rect x="38" y="10" width="6" height="14" fill="#00a3e0"/>
      <rect x="42" y="32" width="8" height="8" fill="#000000"/>
      <rect x="40" y="55" width="12" height="10" fill="#00a3e0"/>
      <rect x="58" y="42" width="22" height="6" fill="#000000"/>
      <rect x="65" y="62" width="14" height="18" fill="#000000"/>
